# Accessibility harness: axe rule sweep, accessibility-tree snapshots, and
# simulated screen-reader announcements against the built site.
#
# Manual-only, and deliberately NOT wired into the pages preflight. A gate is
# only worth having if nobody wants to bypass it, and this job downloads a
# browser -- if that is ever slow or flaky it must not be able to block a deploy.
# Promote it into pages.yml once it has been boring for a while.
#
# Two modes:
#
#   default            verify. Snapshots must already exist; a missing one fails.
#   record_snapshots   re-record. Writes snapshots that are missing OR that have
#                      changed, and uploads them as an artifact to download, read
#                      and commit. Reading the diff is the safeguard: "changed"
#                      would otherwise bless a regression as the new expectation.
#
# Recording happens here rather than on a laptop on purpose. These snapshots are
# checked on this runner, so recording them anywhere else bakes in a platform
# difference that resurfaces later as a failure nobody can reproduce. The
# workflow never commits them itself: a snapshot is an expectation, and it should
# enter the repo through a commit somebody read.
name: a11y

on:
  workflow_dispatch:
    inputs:
      record_snapshots:
        description: "Re-record missing or changed snapshots and upload them for review, instead of failing on them"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The site is served by python3's stdlib http.server (see
      # playwright.config.js), so Python is a requirement of the harness too.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      # No `npm ci`: there is no lockfile yet. Direct dependencies are pinned
      # exactly in package.json, so this is reproducible for them; commit a
      # package-lock.json and switch to `npm ci` to pin transitives too.
      - name: Install harness
        run: npm install

      # TEMPORARY: this repo has no lockfile because it was authored on a machine
      # with no Node. Uploading the one npm resolves here lets it be committed, at
      # which point `npm install` becomes `npm ci` and this step goes away.
      - uses: actions/upload-artifact@v7
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 1

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Verify the artifact under test is current
        # The harness loads site/index.html. Auditing a stale artifact would
        # report on something the deploy would never serve.
        run: python3 tools/build_site.py --check

      - name: Accessibility audit
        env:
          A11Y_RECORD_SNAPSHOTS: ${{ inputs.record_snapshots && '1' || '' }}
        run: npx playwright test

      # Uploaded even on failure: the report is the whole point when something
      # breaks, and on a first run something will.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Only in bootstrap mode, and only if anything was written -- an empty
      # artifact on a normal run would imply snapshots are regenerated each time.
      - name: Collect recorded snapshots
        if: ${{ inputs.record_snapshots && !cancelled() }}
        id: collect
        run: |
          if [ -d tests/a11y/__snapshots__ ]; then
            echo "count=$(find tests/a11y/__snapshots__ -type f | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
            find tests/a11y/__snapshots__ -type f -print | sed 's/^/  /'
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "::warning::No snapshots were written. Either every one already existed, or the run failed before reaching them."
          fi

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.record_snapshots && steps.collect.outputs.count != '0' && !cancelled() }}
        with:
          name: recorded-snapshots
          path: tests/a11y/__snapshots__/
          retention-days: 14
