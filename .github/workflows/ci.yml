# Verify the site on every push and PR.
#
# The single most valuable check here is `build_site.py --check`. site/index.html
# is a generated file that is nevertheless committed (so the site can be used by
# cloning and opening it), and .gitattributes suppresses its diff because its
# product payload is one ~178 KB line. That combination means a stale or
# corrupted artifact is effectively invisible in review -- and since the site is
# served as a static file, the stale artifact IS production. --check is the only
# thing that catches it.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Both scripts are stdlib-only, so there is nothing to install and no
      # lockfile to cache. If that ever changes, this comment is the tell.
      - name: Build is reproducible and the committed artifact is current
        run: python3 tools/build_site.py --check

      - name: Data invariants
        run: python3 -m unittest discover -s tests -v

      - uses: actions/setup-node@v7
        with:
          # Floating rather than pinned, deliberately. run_site_tests.py is
          # engine-agnostic -- it takes whichever of node/bun/deno/jsc it finds --
          # so there is nothing here that depends on a particular version, and a
          # pin only rots: this said "20" until Node 20 went end-of-life, at which
          # point CI was silently exercising an unsupported runtime. Tracking LTS
          # means a new one breaking us shows up as a CI failure, which is the
          # signal we want.
          node-version: "lts/*"

      # Splices the real inline script out of the built site/index.html and
      # exercises it against a DOM stub -- so this tests the shipped artifact,
      # including whether the build substituted the payload correctly.
      - name: Site behaviour
        run: python3 tests/run_site_tests.py

      # The game-file verifier skips in CI: nobody can assume a commercial 1996
      # title is present on a runner, and it must never become a build
      # dependency. tests/test_against_game.py reports the skip explicitly, and
      # asserts that the verifier refuses to exit 0 when it has nothing to check.

      # There was a shell copy of the artwork check here, described in its own
      # comment as "belt-and-braces alongside the equivalent assertion in
      # tests/test_data.py". When Enlight granted permission, the assertion was
      # inverted and this copy was not -- so CI failed on the commit that added
      # the icons, insisting they must not be committed. The duplicate is gone:
      # test_tracked_artwork_matches_the_dataset states the stronger invariant
      # (the tracked set equals what the dataset references) and already runs
      # above, in the Data invariants step.
