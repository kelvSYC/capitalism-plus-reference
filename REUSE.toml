# Machine-readable per-path licensing (https://reuse.software/).
#
# The point of this file is the last entry. Everything else is a restatement of
# LICENSE, but site/images/** needs to be legible to tooling BEFORE any asset
# exists there, so that adding one can never be mistaken for placing it under
# this project's own license.

version = 1
SPDX-PackageName = "capitalism-plus-reference"
SPDX-PackageSupplier = "Kelvin Chung"

[[annotations]]
path = ["tools/**", "tests/**", ".github/**", "data/site_template.html", "site/index.html"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Kelvin Chung"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["data/index_cards.json", "data/index_cards.csv"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Kelvin Chung"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["*.md", "docs/**", "LICENSE", ".gitignore", ".gitattributes", "REUSE.toml", "site/images/.gitkeep"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Kelvin Chung"
SPDX-License-Identifier = "CC-BY-4.0"

# Product artwork from the commercial game, shown and distributed under written
# permission from Enlight Software (David Lee, 2026-08-02). Enlight's copyright,
# NOT this project's license -- the grant is quoted in ATTRIBUTION.md, and the
# permission is specific to this reference. Anyone reusing these files needs
# their own permission; this entry exists so tooling says so rather than
# inferring MIT from the repository around them.
[[annotations]]
path = ["site/images/**"]
precedence = "override"
SPDX-FileCopyrightText = "Enlight Software Limited"
SPDX-License-Identifier = "LicenseRef-Enlight-FanReference-2026"
