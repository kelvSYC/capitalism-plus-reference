  // doesn't touch it), the same way state.view itself isn't reset by filters.
  gridLayout: "cards",
  detailId: null,   // id of the product currently open in the detail view, if any
};

function resetFilters() {
  state.category = null; state.classification = null; state.industry = null;
  state.goodsFilter = null;
  state.showRestricted = false;
  state.dominateFilter = null;
}

const byId = id => PRODUCTS.find(p => p.id === id);
const byGameset = gs => PRODUCTS.filter(p => p.gameset === gs);

function gamesets() {
  return [...new Set(PRODUCTS.map(p => p.gameset))];
}

function renderTabs() {
  const el = document.getElementById('gamesetTabs');
  el.innerHTML = '';
  gamesets().forEach(gs => {
    const d = document.createElement('div');
    d.className = 'tab' + (state.gameset === gs ? ' active' : '');
    d.textContent = gs;
    d.onclick = () => {
      state.gameset = gs; state.scenario = null;
      _scenarioMarketMemo = null; _scenarioMarketMemoKey = null;
      resetFilters();
      // A gameset switch invalidates whatever detail page might be open --
      // it very likely belongs to a different gameset's product (e.g.
      // Cocoa is Standard-only), and leaving it showing while the tab
      // highlights "Food & Beverage" is actively misleading. Reset to the
      // grid in that case, same as any other filter-clearing action. (Graph
      // and Almanac views stay as they are -- switching gameset there just
      // re-renders the same view for the new gameset, which isn't confusing
      // the way a stale, wrong-gameset detail page is.)
      //
      // Route through setView(), not a hand-rolled state.view/display reset
      // -- setView is the one place that also toggles the nav tabs' `active`
      // class. Without it, the content switches to the grid but whichever
      // tab (e.g. "Farmer's Almanac") was highlighted before opening the
      // detail page stays highlighted, showing a view that isn't actually
      // on screen.
      if (state.view === 'detail') setView('grid');
      renderAll();
    };
    el.appendChild(d);
  });
}

document.getElementById('searchBox').addEventListener('input', e => {
  state.search = e.target.value.toLowerCase(); renderGrid();
});

function filteredProducts() {
  let list = byGameset(state.gameset);
  if (state.category) list = list.filter(p => state.category.includes(p.category));
  if (state.classification) list = list.filter(p => p.classification === state.classification);
  if (state.industry) list = list.filter(p => state.industry.some(ind => ind === 'Retailing' ? p.sellable : p.industry === ind));
  if (state.goodsFilter) list = list.filter(p => goodsType(p) === state.goodsFilter);
  // Domination-target filter operates on the game's own raw ITEMCLAS code
  // (p.raw_class) and the industry field directly, NOT the display-oriented
  // category/classification taxonomy used by the chip filters above --
  // dominateClasses can legitimately include classification-level codes
  // (e.g. GLOBAL's LPRODUCT/PSEMI, tracked as their own "markets" in the
  // game's Dominance Report) that wouldn't match any p.category value, so
  // reusing state.category's matching logic here would silently drop them.
  if (state.dominateFilter) {
    const ds = SCENARIOS.find(x => x.key === state.dominateFilter);
    if (ds) list = list.filter(p =>
      ds.dominateClasses.includes(p.raw_class) ||
      ds.dominateIndustries.some(ind => ind === 'Retailing' ? p.sellable : p.industry === ind));
  }
  if (state.scenario && !state.showRestricted) list = list.filter(p => !scenarioRestricted(p));
  if (state.search) list = list.filter(p => p.name.toLowerCase().includes(state.search));
  // Default sort: alphabetical, so browsing the grid is predictable regardless
  // of the order products happen to appear in the game's own data files.
  return list.slice().sort((a, b) => a.name.localeCompare(b.name));
}

function renderSellableChips() {
  const el = document.getElementById('sellableChips');
  el.innerHTML = '';
  el.appendChild(makeChip('Consumer Goods', CONSUMER_GOODS_COLOR, state.goodsFilter === 'Consumer Goods', () => {
    state.goodsFilter = state.goodsFilter === 'Consumer Goods' ? null : 'Consumer Goods'; renderAll();
  }));
  el.appendChild(makeChip('Industrial Goods', INDUSTRIAL_GOODS_COLOR, state.goodsFilter === 'Industrial Goods', () => {
    state.goodsFilter = state.goodsFilter === 'Industrial Goods' ? null : 'Industrial Goods'; renderAll();
  }));
  // A single "Show Restricted" checkbox, standardized across Grid,
  // Dependency Graph, and Farmer's Almanac (see state.showRestricted) --
  // unlike the other filters above this is a checkbox, not a chip, since
  // it's a plain on/off toggle rather than a multi-way selector, and this
  // way it visually matches what used to be the Dependency-Graph-only
  // control before the three views were unified onto one setting.
  if (state.scenario) {
    const label = document.createElement('label');
    label.id = 'showRestrictedToggle';
    label.style.cssText = 'display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;margin-top:8px';
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = state.showRestricted;
    input.onchange = e => { state.showRestricted = e.target.checked; renderAll(); };
    label.appendChild(input);
    label.appendChild(document.createTextNode(' Show Restricted'));
    el.appendChild(label);
  }
}

// Category/Industry chips are multi-select toggles -- click any number of them
// to build an OR filter (e.g. Chemical Products + Electronic Products for The
// Emerging Dragon's actual dominance goal), click again to remove one, click
// "All" to clear the whole selection. Classification stays single-select since
// a product only ever has one classification.
function toggleArrayFilter(key, value) {
  const cur = state[key];
  if (!cur) { state[key] = [value]; return; }
  const i = cur.indexOf(value);
  if (i === -1) { state[key] = [...cur, value]; }
  else { const next = cur.filter(v => v !== value); state[key] = next.length ? next : null; }
}

function renderCategoryChips() {
  const el = document.getElementById('categoryChips');
  el.innerHTML = '';
  const base = byGameset(state.gameset);
  const cats = [...new Set(base.map(p => p.category).filter(Boolean))].sort();
  const allChip = makeChip('All categories', null, state.category === null, () => { state.category = null; renderAll(); });
  el.appendChild(allChip);
  cats.forEach(c => {
    const inCat = base.filter(p => p.category === c);
    el.appendChild(makeChip(c, null, !!state.category && state.category.includes(c), () => { toggleArrayFilter('category', c); renderAll(); }, restrictionLevel(inCat)));
  });
}

function renderIndustryChips() {
  const el = document.getElementById('industryChips');
  el.innerHTML = '';
  const base = byGameset(state.gameset);
  const industries = ['Raw Material Production', 'Farming', 'Manufacturing', 'Retailing'];
  el.appendChild(makeChip('All', null, state.industry === null, () => { state.industry = null; renderAll(); }));
  industries.forEach(ind => {
    const inInd = base.filter(p => ind === 'Retailing' ? p.sellable : p.industry === ind);
    el.appendChild(makeChip(ind, INDUSTRY_COLOR[ind], !!state.industry && state.industry.includes(ind), () => { toggleArrayFilter('industry', ind); renderAll(); }, restrictionLevel(inInd)));
  });
}

function renderClassChips() {
  const el = document.getElementById('classChips');
  el.innerHTML = '';
  const base = byGameset(state.gameset);
  const classes = [...new Set(base.map(p => p.classification))];
  el.appendChild(makeChip('All', null, state.classification === null, () => { state.classification = null; renderAll(); }));
  classes.forEach(c => {
    const inClass = base.filter(p => p.classification === c);
    el.appendChild(makeChip(c, CLASS_SOLID[c], state.classification === c, () => { state.classification = c; renderAll(); }, restrictionLevel(inClass)));
  });
}

// ---- Scenario picker: badges every product with its REAL, byte-verified ----
// ---- sale restriction for the chosen scenario, rather than filtering anything out. ----

function renderScenarioSelect() {
  const sel = document.getElementById('scenarioSelect');
  const gsScenarios = SCENARIOS.filter(s => s.gameset === state.gameset);
  sel.innerHTML = '<option value="">— None (browse all, no scenario) —</option>' +
    gsScenarios.map(s => `<option value="${s.key}"${state.scenario === s.key ? ' selected' : ''}>${s.name}</option>`).join('');
  if (!state.scenario) sel.value = '';
  sel.onchange = () => applyScenario(sel.value || null);

  const info = document.getElementById('scenarioInfo');
  if (!state.scenario) { info.innerHTML = ''; return; }
  const s = currentScenarioObj();
  const excludedNames = s.excludedClasses.map(c => CLASS_DISPLAY_NAME[c] || c);
  // Both category-level targets (dominateClasses) and industry-level targets
  // (dominateIndustries) are byte-verified against the .SCN/.SAV goal header
  // (offsets 415 and 305-308 respectively -- see the SCENARIOS array comment
  // above for the full derivation). When a scenario has an industry-level
  // goal, prefer showing just the industries: for GLOBAL specifically the
  // per-class list (15 codes) and the industry list (all 4) both independently
  // decode to "everything", so showing industries alone avoids a redundant,
  // cluttered 19-item line while still reflecting the same verified goal.
  const dominateNames = s.dominateIndustries.length
    ? s.dominateIndustries
    : s.dominateClasses.map(c => CLASS_DISPLAY_NAME[c] || c);
  const hasDominate = dominateNames.length > 0;
  const dominateOn = state.dominateFilter === s.key;
  info.innerHTML = `<div class="scenario-info">
    <div class="goal">${s.goal}</div>
    <div style="margin-top:6px">Years: ${s.years} &nbsp;·&nbsp; Bonus: ${s.bonus} pts</div>
    ${excludedNames.length
      ? `<div style="margin-top:6px">Restricted here: <b>${excludedNames.join(', ')}</b></div>`
      : `<div style="margin-top:6px">No sale restrictions in this scenario.</div>`}
    ${hasDominate
      ? `<div style="margin-top:6px">Must dominate: <b>${dominateNames.join(', ')}</b>
          <span class="clear" style="margin-left:8px" title="Byte-decoded from the save file's goal header" onclick="toggleDominateFilter('${s.key}')">${dominateOn ? 'Show all products' : 'Filter to these'}</span>
        </div>`
      : ''}
    <span class="clear" onclick="applyScenario(null)">Clear scenario</span>
  </div>`;
}

function applyScenario(key) {
  // "Show Restricted" defaults OFF whenever a scenario is (re-)applied (so
  // every view starts showing only what's actually available in this
  // scenario), and stays off once the scenario is cleared (restriction
  // status is meaningless with no scenario selected, so it doesn't matter).
  state.showRestricted = false;
  // The domination-target filter is scenario-specific -- clear it whenever
  // the scenario changes (or is cleared) rather than leaving a stale filter
  // from a different scenario silently applied to the new one.
  state.dominateFilter = null;
  state.scenario = key;
  _scenarioMarketMemo = null; _scenarioMarketMemoKey = null;
  if (key) {
    const s = SCENARIOS.find(x => x.key === key);
    state.gameset = s.gameset;
  }
  renderAll();
}

function toggleDominateFilter(key) {
  state.dominateFilter = state.dominateFilter === key ? null : key;
  renderAll();
}

function makeChip(label, color, active, onclick, level) {
  const d = document.createElement('div');
  const cls = level === 'full' ? ' chip-restricted' : level === 'partial' ? ' chip-partial' : '';
  d.className = 'chip' + (active ? ' active' : '') + cls;
  if (color) {
    const sw = document.createElement('span');
    sw.className = 'swatch'; sw.style.background = color;
    d.appendChild(sw);
  }
  const span = document.createElement('span');
  span.className = 'label';
  span.textContent = level === 'full' ? '✕ ' + label : level === 'partial' ? '± ' + label : label;
  d.appendChild(span);
  if (level === 'full') d.title = 'Every product here is restricted in the current scenario';
  else if (level === 'partial') d.title = 'Some products here are restricted in the current scenario -- check individual items';
  d.onclick = onclick;
  return d;
}

// A chip's whole group is greyed out ("full") when the current scenario leaves
// no un-restricted product behind it -- mirrors the original OmniGraffle-era
// greyed-out category treatment, now driven by the real decoded restriction
// data instead of a guess. "partial" flags mixed groups -- e.g. a Category
// chip can span several classifications that a scenario treats differently
// (Livestock Product fully banned, Livestock Semi-Product not) -- so the chip
// alone can't tell you whether every item in it is safe; check individual badges.
function restrictionLevel(list) {
  if (!state.scenario || list.length === 0) return 'none';
  const restrictedCount = list.filter(scenarioRestricted).length;
  if (restrictedCount === 0) return 'none';
  if (restrictedCount === list.length) return 'full';
  return 'partial';
}

function setGridLayout(v) {
  state.gridLayout = v;
  renderGrid();
}

function renderGrid() {
  const list = filteredProducts();
  const el = document.getElementById('grid-view');
  const toggle = `<span class="layout-toggle">
    <span class="chip${state.gridLayout === 'cards' ? ' active' : ''}" onclick="setGridLayout('cards')">Cards</span>
    <span class="chip${state.gridLayout === 'list' ? ' active' : ''}" onclick="setGridLayout('list')">List</span>
  </span>`;
  if (list.length === 0) {
    el.innerHTML = `<div class="count">0 products${toggle}</div><div class="empty">No products match the current filters.</div>`;
    return;
  }
  let html = `<div class="count">${list.length} product${list.length===1?'':'s'}${toggle}</div>`;
  if (state.gridLayout === 'list') {
    // Mirrors the Farmer's Almanac's table layout/styling (same restricted-row
    // dim + strikethrough treatment) rather than inventing a third visual
    // language -- one row per product instead of one icon-forward card, for
    // scanning a large filtered set quickly.
    html += `<table class="grid-table"><thead><tr>
      <th>Product</th><th>Category</th><th>Classification</th><th>Goods Type</th><th></th>
    </tr></thead><tbody>`;
    list.forEach(p => {
      const restricted = scenarioRestricted(p);
      html += `<tr onclick="openDetail('${p.id.replace(/'/g,"\\'")}')" class="${restricted ? 'restricted-row' : ''}">
        <td><div class="grid-name-cell"><img src="images/${p.icon_file}">${p.name}</div></td>
        <td>${p.category || p.classification}</td>
        <td><span class="badge" style="background:${CLASS_COLORS[p.classification]}">${p.classification}</span></td>
        <td>${goodsTypeLabel(p)}</td>
        <td>${restrictionBadge(p)}</td>
      </tr>`;
    });
    html += '</tbody></table>';
  } else {
    html += '<div class="grid">';
    list.forEach(p => {
      const restricted = scenarioRestricted(p);
      html += `<div class="card${restricted ? ' restricted' : ''}" onclick="openDetail('${p.id.replace(/'/g,"\\'")}')">
        <img src="images/${p.icon_file}">
        <div class="name">${p.name}</div>
        <div class="cat">${p.category || p.classification}</div>
        <div class="badge" style="background:${CLASS_COLORS[p.classification]}">${p.classification}</div>${goodsTypeBadge(p)}${restrictionBadge(p)}
      </div>`;
    });
    html += '</div>';
  }
  el.innerHTML = html;
}

function pctColor(i) {
  const palette = ['#4C9AFF', '#57D9A3', '#FFAB00', '#FF7452', '#998DD9'];
  return palette[i % palette.length];
}

function openDetail(id) {
  const p = byId(id);
  state.view = 'detail';
  state.detailId = id;
  document.getElementById('grid-view').style.display = 'none';
  document.getElementById('graph-view').style.display = 'none';
  const el = document.getElementById('detail-view');
  el.style.display = 'block';

  let html = `<div class="back" onclick="backToGrid()">&larr; Back</div>`;
  html += `<div class="detail">`;
  html += `<div class="detail-head">
    <img src="images/${p.icon_file}">
    <div>
      <h2>${p.name}</h2>
      <div class="cat">${p.category || ''}${p.category ? ' · ' : ''}${p.industry} · ${p.gameset} gameset</div>
      <div class="badge-lg" style="background:${CLASS_COLORS[p.classification]}">${p.classification}</div>${goodsTypeBadge(p, 'lg')}${restrictionBadge(p, 'lg')}
    </div>
  </div>`;
  html += restrictionExplanation(p);

  if (p.classification === 'Livestock') {
    const visibleYields = (p.livestock_yields || []).filter(yName => relVisible(PRODUCTS.find(x => x.gameset === p.gameset && x.name === yName), p));
    html += `<div class="section"><h3>Raising Unit</h3>
      <p style="font-size:13px;color:var(--muted);margin-top:0">Livestock aren't bought or sold as products — they populate a Livestock unit on a farm and are processed there to continuously yield the goods below.</p>
      <ul class="yield-list">`;
    if (visibleYields.length) {
      visibleYields.forEach(yName => {
        const yp = PRODUCTS.find(x => x.gameset === p.gameset && x.name === yName);
        html += `<li onclick="${yp ? `openDetail('${yp.id.replace(/'/g,"\\'")}')` : ''}">
          ${yp ? `<img src="images/${yp.icon_file}"${relImgStyle(yp)}>` : ''}
          <span><span${relNameStyle(yp)}>${yName}${yp ? ` <span style="color:var(--muted)">(${yp.classification})</span>` : ''}</span>${yp ? restrictionNote(yp) : ''}</span>
        </li>`;
      });
    } else if ((p.livestock_yields || []).length) {
      html += `<li style="color:var(--muted)">— none shown (restricted; check "Show Restricted" in the sidebar) —</li>`;
    }
    html += `</ul></div>`;
  } else {
    if (p.inputs && p.inputs.length > 0) {
      // production_technology_pct is derived directly as 100 - (sum of input
      // quality_pct) during data rebuild, not read from a second, independent
      // field -- an earlier version of the pipeline pulled it from an older
      // prior-art dataset instead, which had drifted out of sync for 5 of 245
      // products (Black Pepper was recorded as 50% there; the game's own
      // Manufacturer's Guide screen shows 75%, i.e. 100 - 25). Every product's
      // bar should now genuinely sum to 100% at the source, so this scale
      // factor is just a defensive no-op (1.0) rather than a real correction.
      const rawTotal = p.inputs.reduce((sum, inp) => sum + (inp.quality_pct || 0), 0) + (p.production_technology_pct || 0);
      const scale = rawTotal > 0 ? 100 / rawTotal : 1;
      html += `<div class="bar-wrap"><div class="bar">`;
      p.inputs.forEach((inp, i) => {
        html += `<div class="bar-seg" style="width:${(inp.quality_pct || 0) * scale}%;background:${pctColor(i)}">${inp.quality_pct}%</div>`;
      });
      if (p.production_technology_pct) {
        html += `<div class="bar-seg" style="width:${p.production_technology_pct * scale}%;background:#555b66">${p.production_technology_pct}%</div>`;
      }
      html += `</div><div class="bar-legend">`;
      p.inputs.forEach((inp, i) => {
        html += `<span><span class="sw" style="background:${pctColor(i)}"></span>${inp.material} — ${inp.amount} ${inp.unit || ''}</span>`;
      });
      if (p.production_technology_pct) {
        html += `<span><span class="sw" style="background:#555b66"></span>Production Technology</span>`;
      }
      html += `</div></div>`;
    }

    if (p.output_quantity) {
      html += `<div class="section"><h3>Output</h3><div class="kv"><div class="k">Yield</div><div>${p.output_quantity} ${p.output_unit || ''} per production run</div></div></div>`;
    }

    if (p.growing_conditions) {
      const g = p.growing_conditions;
      html += `<div class="section"><h3>Growing Conditions</h3><div class="kv">
        <div class="k">Suitable Climate</div><div>${g.climate}</div>
        <div class="k">Suitable Rainfall</div><div>${g.rainfall}</div>
        <div class="k">Sowing Month</div><div>${g.sowing_month}</div>
        <div class="k">Harvesting Month</div><div>${g.harvesting_month}</div>
      </div></div>`;
    }

    if (p.derived_from_livestock) {
      // Filter by the same "Show Restricted" toggle used everywhere else
      // (see relVisible) -- an animal that's itself restricted stays hidden
      // by default, and shows dimmed/struck-through once checked.
      const visibleSources = p.derived_from_livestock.filter(animalName => {
        const ap = PRODUCTS.find(x => x.gameset === p.gameset && x.name === animalName);
        return relVisible(ap, p);
      });
      html += `<div class="section"><h3>Source</h3><ul class="yield-list">`;
      if (visibleSources.length) {
        visibleSources.forEach(animalName => {
          const ap = PRODUCTS.find(x => x.gameset === p.gameset && x.name === animalName);
          html += `<li onclick="${ap ? `openDetail('${ap.id.replace(/'/g,"\\'")}')` : ''}">
            ${ap ? `<img src="images/${ap.icon_file}"${relImgStyle(ap)}>` : ''}<span><span${relNameStyle(ap)}>${animalName}</span>${ap ? restrictionNote(ap) : ''}</span>
          </li>`;
        });
      } else {
        html += `<li style="color:var(--muted)">— none shown (restricted; check "Show Restricted" in the sidebar) —</li>`;
      }
      html += `</ul></div>`;
    }

    const visibleInputs = (p.inputs || []).filter(inp => relVisible(PRODUCTS.find(x => x.gameset === p.gameset && x.name === inp.material), p));
    const visibleUsedIn = (p.used_in || []).filter(u => relVisible(byId(u.id), p));
    const hasInputs = p.inputs && p.inputs.length > 0;
    const hasUsedIn = p.used_in && p.used_in.length > 0;
    if (hasInputs || hasUsedIn) {
      html += `<div class="section"><h3>Immediate Dependencies</h3><div class="rel-cols">
        <div><h4>Made from (direct inputs)</h4><ul class="rel-list">`;
      if (hasInputs && visibleInputs.length) {
        visibleInputs.forEach(inp => {
          const ip = PRODUCTS.find(x => x.gameset === p.gameset && x.name === inp.material);
          html += `<li onclick="${ip ? `openDetail('${ip.id.replace(/'/g,"\\'")}')` : ''}">
            ${ip ? `<img src="images/${ip.icon_file}"${relImgStyle(ip)}>` : ''}
            <span><span${relNameStyle(ip)}>${inp.material}</span>${ip ? restrictionNote(ip) : ''}<br><span style="color:var(--muted);font-size:11px;${relStrikeCss(ip)}">${inp.amount} ${inp.unit || ''} · Q:${inp.quality_pct}%</span></span>
          </li>`;
        });
      } else if (!hasInputs) {
        html += `<li style="color:var(--muted)">— none (raw input) —</li>`;
      } else {
        html += `<li style="color:var(--muted)">— none shown (restricted; check "Show Restricted" in the sidebar) —</li>`;
      }
      html += `</ul></div><div><h4>Used in (direct consumers)</h4><ul class="rel-list">`;
      if (hasUsedIn && visibleUsedIn.length) {
        visibleUsedIn.forEach(u => {
          const up = byId(u.id);
          html += `<li onclick="openDetail('${u.id.replace(/'/g,"\\'")}')">
            ${up ? `<img src="images/${up.icon_file}"${relImgStyle(up)}>` : ''}
            <span><span${relNameStyle(up)}>${u.product}</span>${up ? restrictionNote(up) : ''}<br><span style="color:var(--muted);font-size:11px;${relStrikeCss(up)}">${u.amount} ${u.unit || ''} · Q:${u.quality_pct}%</span></span>
          </li>`;
        });
      } else if (!hasUsedIn) {
        html += `<li style="color:var(--muted)">— none (sold directly) —</li>`;
      } else {
        html += `<li style="color:var(--muted)">— none shown (restricted; check "Show Restricted" in the sidebar) —</li>`;
      }
      html += `</ul></div></div></div>`;
    }

    html += `<div class="section"><h3>Dependency Diagram (transitive)</h3>
      <p style="font-size:12px;color:var(--muted);margin-top:0">Everything this product is transitively made from (left) through everything it transitively ends up in (right). Click any node to jump to it.</p>
      <div class="spider-wrap"><svg id="spider-svg"></svg></div>
    </div>`;
  }

  html += `</div>`;
  el.innerHTML = html;
  window.scrollTo(0,0);

  if (p.classification !== 'Livestock') {
    const closureNodes = transitiveClosure(p);
    drawLayeredGraph(d3.select('#spider-svg'), closureNodes, {
      colWidth: 180, rowHeight: 32, minWidth: 500, minHeight: 200,
      focalName: p.name,
      showEdgeLabels: false,
      showYield: false,
      onClick: node => { if (node.name !== p.name) openDetail(node.id); },
    });
  }
}

function backToGrid() {
  // Route through setView() so the "Grid"/"Dependency Graph"/"Farmer's
  // Almanac" nav tab highlighting stays in sync with what's actually on
  // screen -- e.g. opening a product from the Almanac and then clicking
  // "Back" used to leave "Farmer's Almanac" highlighted even though the
  // grid was now showing (same bug class as the gameset-tab handler above).
  setView('grid');
  renderGrid();
}

function setView(v) {
  state.view = v;
  state.detailId = null;
  document.getElementById('viewGrid').classList.toggle('active', v === 'grid');
  document.getElementById('viewGraph').classList.toggle('active', v === 'graph');
  document.getElementById('viewAlmanac').classList.toggle('active', v === 'almanac');
  document.getElementById('grid-view').style.display = v === 'grid' ? 'block' : 'none';
  document.getElementById('graph-view').style.display = v === 'graph' ? 'block' : 'none';
  document.getElementById('almanac-view').style.display = v === 'almanac' ? 'block' : 'none';
  document.getElementById('detail-view').style.display = 'none';
  if (v === 'graph') renderGraph();
  else if (v === 'almanac') renderAlmanac();
}

// ---- Shared layered ("Sugiyama-style") DAG layout: raw materials on the left, ----
// ---- terminal / never-consumed products (Retail Products) aligned on the right. ----

function buildLinks(nodeList) {
  const names = new Set(nodeList.map(p => p.name));
  const links = [];
  nodeList.forEach(p => {
    (p.inputs || []).forEach(inp => {
      if (names.has(inp.material)) {
        links.push({ source: inp.material, target: p.name, amount: inp.amount, unit: inp.unit });
      }
    });
    (p.livestock_yields || []).forEach(yName => {
      if (names.has(yName)) links.push({ source: p.name, target: yName });
    });
  });
  return links;
}

function computeLayeredPositions(nodeList) {
  const realLinks = buildLinks(nodeList);
  const outgoing = new Map(), incoming = new Map();
  realLinks.forEach(l => {
    if (!outgoing.has(l.source)) outgoing.set(l.source, []);
    outgoing.get(l.source).push(l.target);
    if (!incoming.has(l.target)) incoming.set(l.target, []);
    incoming.get(l.target).push(l.source);
  });

  // Natural tier = longest path from a source (raw material / livestock) node.
  const tier = new Map();
  function calcTier(name, stack) {
    if (tier.has(name)) return tier.get(name);
    if (stack.has(name)) return 0; // guard against any cyclical data
    stack.add(name);
    const preds = incoming.get(name) || [];
    const t = preds.length ? 1 + Math.max(...preds.map(pr => calcTier(pr, stack))) : 0;
    tier.set(name, t);
    stack.delete(name);
    return t;
  }
  nodeList.forEach(p => calcTier(p.name, new Set()));
  const naturalMax = Math.max(0, ...tier.values());

  // Sink alignment: anything that's produced by something (tier > 0) but never
  // consumed further within this scope is a terminal/finished good -- push it to
  // the rightmost column, regardless of how "deep" its own chain happened to be.
  nodeList.forEach(p => {
    const outs = outgoing.get(p.name) || [];
    if (outs.length === 0 && tier.get(p.name) > 0) tier.set(p.name, naturalMax);
  });
  const maxTier = Math.max(0, ...tier.values());

  // Any link that skips over one or more columns (e.g. a raw material at tier 0
  // feeding a product at tier 2) is routed through invisible waypoint nodes
  // placed in each intermediate tier. Without this, the line would cut straight
  // through whatever real nodes happen to occupy the columns in between, making
  // it look like it connects to them.
  // Once sink-alignment pushes every finished good to the same rightmost column,
  // long skip-edges become extremely common (a product just one hop from a raw
  // material still has to visually cross every tier in between). Routing each
  // edge through its own private dummy chain gives every one of those edges its
  // own row, which balloons column height and turns the diagram into a dense
  // dome of nested arcs. Instead, all edges leaving the same source node share a
  // single waypoint per intermediate tier, so they travel together as one
  // bundled trunk and only fan out near their real targets.
  let dummyN = 0;
  const dummyTier = new Map();
  const dummyCache = new Map();
  const chainOf = new Map();
  const orderOutgoing = new Map(), orderIncoming = new Map();
  function addOrder(a, b) {
    if (!orderOutgoing.has(a)) orderOutgoing.set(a, []);
    orderOutgoing.get(a).push(b);
    if (!orderIncoming.has(b)) orderIncoming.set(b, []);
    orderIncoming.get(b).push(a);
  }
  function sharedDummy(source, t) {
    const key = source + '::' + t;
    if (dummyCache.has(key)) return dummyCache.get(key);
    const dname = 'dummy' + (dummyN++);
    dummyTier.set(dname, t);
    dummyCache.set(key, dname);
    return dname;
  }
  realLinks.forEach((l, idx) => {
    const st = tier.get(l.source), tt = tier.get(l.target);
    const path = [l.source];
    for (let t = st + 1; t < tt; t++) path.push(sharedDummy(l.source, t));
    path.push(l.target);
    for (let i = 0; i < path.length - 1; i++) addOrder(path[i], path[i + 1]);
    chainOf.set(idx, path);
  });

  const tierGroups = [];
  for (let t = 0; t <= maxTier; t++) tierGroups.push([]);
  nodeList.forEach(p => tierGroups[tier.get(p.name)].push({ name: p.name }));
  dummyTier.forEach((t, name) => tierGroups[t].push({ name }));
  tierGroups.forEach(g => g.sort((a, b) => a.name.localeCompare(b.name)));

  const posIndex = new Map();
  tierGroups.forEach(g => g.forEach((n, i) => posIndex.set(n.name, i)));

  // Barycenter passes to reduce edge crossings.
  for (let pass = 0; pass < 4; pass++) {
    for (let t = 1; t <= maxTier; t++) {
      tierGroups[t].forEach(n => {
        const preds = orderIncoming.get(n.name) || [];
        n._bary = preds.length ? d3.mean(preds, p => posIndex.get(p) ?? 0) : posIndex.get(n.name);
      });
      tierGroups[t].sort((a, b) => a._bary - b._bary);
      tierGroups[t].forEach((n, i) => posIndex.set(n.name, i));
    }
    for (let t = maxTier - 1; t >= 0; t--) {
      tierGroups[t].forEach(n => {
        const succs = orderOutgoing.get(n.name) || [];
        n._bary = succs.length ? d3.mean(succs, p => posIndex.get(p) ?? 0) : posIndex.get(n.name);
      });
      tierGroups[t].sort((a, b) => a._bary - b._bary);
      tierGroups[t].forEach((n, i) => posIndex.set(n.name, i));
    }
  }

  return { tierGroups, realLinks, chainOf, maxTier, orderOutgoing, orderIncoming };
}

function drawLayeredGraph(svgSel, nodeList, opts) {
  opts = opts || {};
  const { tierGroups, realLinks, chainOf, maxTier, orderOutgoing, orderIncoming } = computeLayeredPositions(nodeList);
  const maxRows = Math.max(1, ...tierGroups.map(g => g.length));
  const colWidth = opts.colWidth || 200;
  const rowHeight = opts.rowHeight || 30;
  const width = Math.max(opts.minWidth || 700, 80 + (maxTier + 1) * colWidth);
  // Mutable: the straightening pass below can spread nodes out further than
  // this initial estimate (e.g. a tier that has to align with several wide
  // neighbors), so the final canvas height is re-derived from the nodes'
  // actual post-relaxation extent, not fixed here -- see below.
  let height = Math.max(opts.minHeight || 400, maxRows * rowHeight + 60);

  const coords = new Map();
  tierGroups.forEach((g, t) => {
    const x = 50 + t * colWidth;
    const n = g.length;
    g.forEach((entry, i) => {
      const y = height / 2 - ((n - 1) * rowHeight) / 2 + i * rowHeight;
      coords.set(entry.name, { x, y });
    });
  });

  // Straighten edges. The centering above packs every tier around the same
  // midline using only *its own* row count, with no regard for where a
  // node's actual neighbors landed -- so a lone node in a short tier (e.g.
  // Chicken, Gold) gets centered on the tall canvas set by the densest tier
  // (usually the raw-materials column) rather than aligned with whatever
  // single node it connects to, forcing bumpPath's curve to bow out even
  // though nothing was in the way. This is the classic Sugiyama-layout
  // "y-coordinate assignment" step: reorder was already decided by the
  // barycenter passes above (crossing minimization) -- this only moves nodes
  // up/down *within* their fixed left-to-right order to sit as close as
  // possible to the average position of whatever they connect to, so lines
  // between simple/isolated chains go straight instead of arcing.
  //
  // Each pass nudges every node toward the mean y of its neighbors, then
  // re-spaces nodes within a tier via isotonic regression (pool-adjacent-
  // violators) -- the same fixed left-to-right order as before, just the
  // closest possible set of y's to the desired ones that still keeps every
  // node at least rowHeight apart. That keeps it a well-defined optimum
  // rather than an unbounded push that could balloon the canvas over passes.
  function spaceOut(ys, minGap) {
    const n = ys.length;
    if (n === 0) return ys;
    const shifted = ys.map((y, i) => y - i * minGap);
    const blocks = shifted.map(v => ({ sum: v, w: 1 }));
    let merged = true;
    while (merged) {
      merged = false;
      for (let i = 0; i < blocks.length - 1; i++) {
        if (blocks[i].sum / blocks[i].w > blocks[i + 1].sum / blocks[i + 1].w + 1e-9) {
          blocks.splice(i, 2, { sum: blocks[i].sum + blocks[i + 1].sum, w: blocks[i].w + blocks[i + 1].w });
          merged = true;
          break;
        }
      }
    }
    const out = [];
    blocks.forEach(b => { const avg = b.sum / b.w; for (let k = 0; k < b.w; k++) out.push(avg); });
    return out.map((v, i) => v + i * minGap);
  }
  function meanY(names) {
    if (!names || !names.length) return null;
    return names.reduce((s, nm) => s + coords.get(nm).y, 0) / names.length;
  }
  function resolveTier(t) {
    const group = tierGroups[t];
    const ys = group.map(n => coords.get(n.name).y);
    const spaced = spaceOut(ys, rowHeight);
    group.forEach((n, i) => { coords.get(n.name).y = spaced[i]; });
  }
  for (let pass = 0; pass < 6; pass++) {
    for (let t = 1; t <= maxTier; t++) {
      tierGroups[t].forEach(n => {
        const desired = meanY(orderIncoming.get(n.name));
        if (desired != null) coords.get(n.name).y = desired;
      });
      resolveTier(t);
    }
    for (let t = maxTier - 1; t >= 0; t--) {
      tierGroups[t].forEach(n => {
        const desired = meanY(orderOutgoing.get(n.name));
        if (desired != null) coords.get(n.name).y = desired;
      });
      resolveTier(t);
    }
  }
  // Collapse dead vertical space. Straightening each tier against its own
  // neighbors is a purely local optimization -- it has no notion of overall
  // compactness, so a small disconnected chain (e.g. Cabbage -> Sauerkraut,
  // the only two nodes in the whole graph that touch each other) can end up
  // aligned somewhere no OTHER tier has anything nearby, leaving a band of
  // canvas that is empty in literally every column at once. That's pure
  // waste -- nothing downstream needed that gap for routing or legibility,
  // it's just where two unrelated clusters happened to land. Find any such
  // fully-empty band (checked across every tier's nodes together, not
  // per-tier) and squeeze it down to a small fixed cap.
  const sortedY = [...new Set([...coords.values()].map(c => Math.round(c.y * 100) / 100))].sort((a, b) => a - b);
  const maxGap = rowHeight * 2.5;
  const cuts = [];
  let shrink = 0;
  for (let i = 1; i < sortedY.length; i++) {
    const gap = sortedY[i] - sortedY[i - 1];
    if (gap > maxGap) {
      shrink += gap - maxGap;
      cuts.push({ after: sortedY[i - 1], shrink });
    }
  }
  if (cuts.length) {
    // Compare in the same rounded space `sortedY`/`cuts` were built from --
    // otherwise a pair of nodes that are meant to sit together right at a
    // cut boundary (e.g. two single-edge chains one rowHeight apart, both
    // legitimately on the "near" side of the gap) can straddle it: one
    // node's un-rounded y lands a hair above the rounded threshold, the
    // other a hair below, and only one of them gets the reduction --
    // wrenching two nodes that were correctly aligned with their own
    // partners apart from each other by the full shrink amount.
    coords.forEach(c => {
      const cy = Math.round(c.y * 100) / 100;
      let reduction = 0;
      for (const cut of cuts) if (cy > cut.after) reduction = cut.shrink;
      c.y -= reduction;
    });
  }

  // Fit the canvas to the relaxed layout, rather than trusting the pre-
  // relaxation estimate. The straightening pass above can spread a tier's
  // nodes wider than `height` (a lone node aligning with several spread-out
  // neighbors, for instance) -- if the SVG's own viewBox/height weren't
  // grown to match, nodes past the original boundary would be silently
  // clipped by the SVG's default overflow:hidden, invisible and unreachable
  // no matter how far the containing div is scrolled. So: measure the real
  // extent after relaxation (and after the dead-space collapse above), grow
  // the canvas to fit it (with margin), and shift everything to sit inside
  // that margin -- never just re-center within the old, possibly-too-short
  // height.
  const allY = [...coords.values()].map(c => c.y);
  const minY = Math.min(...allY), maxY = Math.max(...allY);
  const margin = 30;
  const neededHeight = (maxY - minY) + margin * 2;
  if (neededHeight > height) height = neededHeight;
  const shift = margin - minY;
  coords.forEach(c => { c.y += shift; });

  svgSel.attr('viewBox', `0 0 ${width} ${height}`).attr('width', width).attr('height', height);
  svgSel.selectAll('*').remove();

  const baseR = opts.iconRadius || 11;
  const isFocal = p => opts.focalName && p.name === opts.focalName;
  const nodeR = p => isFocal(p) ? baseR * 1.35 : baseR;

  const defs = svgSel.append('defs');
  defs.append('clipPath').attr('id', 'nodeIconClip').append('circle').attr('r', baseR);
  defs.append('clipPath').attr('id', 'nodeIconClipFocal').append('circle').attr('r', baseR * 1.35);

  const drawnLinks = [];
  realLinks.forEach((l, idx) => {
    const path = chainOf.get(idx);
    if (!path.every(n => coords.has(n))) return;
    drawnLinks.push({ link: l, points: path.map(n => coords.get(n)) });
  });

  // Chain a standard horizontal-link "bump" curve between each consecutive pair
  // of waypoints, rather than fitting one smooth spline through all of them --
  // a global spline through a skip-edge's waypoints tends to overshoot and bow
  // out well past the actual bend point, which is hard to visually trace.
  // Chaining keeps each segment tightly bound to its own two endpoints (and is
  // identical to a plain d3.linkHorizontal for direct, non-skipping edges).
  function bumpPath(points) {
    let d = `M${points[0].x},${points[0].y}`;
    for (let i = 0; i < points.length - 1; i++) {
      const a = points[i], b = points[i + 1];
      const mx = (a.x + b.x) / 2;
      d += `C${mx},${a.y} ${mx},${b.y} ${b.x},${b.y}`;
    }
    return d;
  }
  const linkSel = svgSel.append('g').selectAll('path')
    .data(drawnLinks)
    .join('path')
    .attr('class', 'link')
    .attr('d', d => bumpPath(d.points));
  linkSel.append('title')
    .text(d => d.link.amount != null
      ? `${d.link.source} → ${d.link.target}: ${d.link.amount}${d.link.unit ? ' ' + d.link.unit : ''}`
      : `${d.link.source} → ${d.link.target}`);

  // Visible quantity labels for immediate (directly-connected) dependencies --
  // only when the scope is small enough to stay readable; otherwise rely on the
  // hover tooltip above. Anchored at the actual bend point of the drawn curve
  // (not a straight source/target average) and nudged perpendicular to the
  // local line direction so it doesn't sit directly on top of the line or
  // whatever node happens to be near the midpoint.
  const showLabels = opts.showEdgeLabels !== undefined ? opts.showEdgeLabels : drawnLinks.length <= 80;
  if (showLabels) {
    const labelled = drawnLinks.filter(d => d.link.amount != null);
    const labelG = svgSel.append('g');
    labelled.forEach(d => {
      const pts = d.points;
      const midIdx = (pts.length - 1) / 2;
      const i0 = Math.floor(midIdx), i1 = Math.ceil(midIdx);
      const mx = (pts[i0].x + pts[i1].x) / 2, my = (pts[i0].y + pts[i1].y) / 2;
      const dx = pts[i1].x - pts[i0].x, dy = pts[i1].y - pts[i0].y;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;
      const offset = 8;
      const lx = mx + nx * offset, ly = my + ny * offset;
      const text = `${d.link.amount}${d.link.unit ? ' ' + d.link.unit : ''}`;
      const g = labelG.append('g').attr('transform', `translate(${lx},${ly})`).attr('class', 'edge-label');
      const w = text.length * 5.3 + 8;
      g.append('rect').attr('x', -w / 2).attr('y', -8).attr('width', w).attr('height', 14).attr('rx', 3);
      g.append('text').attr('text-anchor', 'middle').attr('dy', 3).text(text);
    });
  }

  // A scenario-restricted node (see scenarioRestricted) is kept in the graph
  // rather than removed -- it's still a real part of the production chain, it
  // just can't legally be sold anywhere under the active scenario -- so it's
  // dimmed and struck through instead, mirroring the chip / badge treatment
  // used elsewhere, and giving each node its own tooltip explaining why.
  const nodeSel = svgSel.append('g').selectAll('g')
    .data(nodeList.filter(p => coords.has(p.name)))
    .join('g')
    .attr('class', p => 'node' + (scenarioRestricted(p) ? ' node-restricted' : ''))
    .attr('transform', p => `translate(${coords.get(p.name).x},${coords.get(p.name).y})`)
    .style('opacity', p => scenarioRestricted(p) ? 0.4 : 1)
    .on('click', (event, p) => opts.onClick && opts.onClick(p));

  nodeSel.append('title')
    .text(p => {
      const kind = restrictionKind(p);
      return kind ? `${p.name} -- ${restrictionKindInfo(p, kind).title}` : p.name;
    });

  nodeSel.append('circle')
    .attr('r', p => nodeR(p) + 2)
    .attr('fill', p => CLASS_SOLID[p.classification] || '#888')
    .attr('stroke', p => isFocal(p) ? '#fff' : (scenarioRestricted(p) ? '#B00020' : '#0006'))
    .attr('stroke-width', p => isFocal(p) ? 2.5 : (scenarioRestricted(p) ? 2 : 1))
    .attr('stroke-dasharray', p => scenarioRestricted(p) ? '3,2' : null);

  nodeSel.append('image')
    .attr('href', p => 'images/' + p.icon_file)
    .attr('x', p => -nodeR(p))
    .attr('y', p => -nodeR(p))
    .attr('width', p => nodeR(p) * 2)
    .attr('height', p => nodeR(p) * 2)
    .attr('clip-path', p => isFocal(p) ? 'url(#nodeIconClipFocal)' : 'url(#nodeIconClip)');

  const showYield = opts.showYield !== undefined ? opts.showYield : true;

  nodeSel.append('text')
    .attr('class', 'node-name')
    .attr('x', p => nodeR(p) + 8)
    .attr('dy', p => (showYield && p.output_quantity != null) ? -1 : 4)
    .style('font-weight', p => isFocal(p) ? 'bold' : 'normal')
    .style('text-decoration', p => scenarioRestricted(p) ? 'line-through' : null)
    .text(p => p.name);

  // Each node's own recipe yield -- shown separately from the edge labels so it's
  // clear the amount an input edge consumes (to make one batch of this node) is a
  // different scale from the amount a downstream edge consumes (from that batch).
  if (showYield) {
    nodeSel.filter(p => p.output_quantity != null).append('text')
      .attr('class', 'node-yield')
      .attr('x', p => nodeR(p) + 8)
      .attr('dy', 12)
      .text(p => `yields ${p.output_quantity}${p.output_unit ? ' ' + p.output_unit : ''} per batch`);
  }

  return { width, height };
}

function transitiveClosure(focal) {
  const gsProducts = byGameset(focal.gameset);
  const links = buildLinks(gsProducts);
  const outgoing = new Map(), incoming = new Map();
  links.forEach(l => {
    if (!outgoing.has(l.source)) outgoing.set(l.source, []);
    outgoing.get(l.source).push(l.target);
    if (!incoming.has(l.target)) incoming.set(l.target, []);
    incoming.get(l.target).push(l.source);
  });
  const included = new Set([focal.name]);
  (function walkUp(name) {
    (incoming.get(name) || []).forEach(pr => { if (!included.has(pr)) { included.add(pr); walkUp(pr); } });
  })(focal.name);
  (function walkDown(name) {
    (outgoing.get(name) || []).forEach(nx => { if (!included.has(nx)) { included.add(nx); walkDown(nx); } });
  })(focal.name);
  let result = gsProducts.filter(p => included.has(p.name));
  // Standardized with the main Dependency Graph and every relation list on
  // this same detail page (see state.showRestricted): restricted nodes are
  // left out of this mini spider diagram by default too, except the focal
  // product itself, which always stays put regardless of its own status.
  if (state.scenario && !state.showRestricted) result = result.filter(p => p.name === focal.name || !scenarioRestricted(p));
  return result;
}

// Products in scope for the graph view. When a category or classification filter is
// active, the diagram shows every matching product PLUS everything transitively
// needed to build it (upstream chain), even if those inputs sit outside the
// filtered category -- otherwise the chart would show disconnected islands.
function graphScopeProducts() {
  let base = byGameset(state.gameset);
  // Scenario-restricted products (see scenarioRestricted) are hidden by
  // default, matching Grid and Almanac -- see state.showRestricted. When
  // "Show Restricted" is checked, they're kept in the graph instead of
  // removed: they're still a real, buildable part of the production chain
  // (e.g. Cattle really does produce Frozen Beef), it just can't legally be
  // sold anywhere under the active scenario, and drawLayeredGraph dims and
  // strikes through those nodes so the graph shows exactly where a chain
  // dead-ends.
  let focus = base;
  if (state.category) focus = focus.filter(p => state.category.includes(p.category));
  if (state.classification) focus = focus.filter(p => p.classification === state.classification);
  if (state.industry) focus = focus.filter(p => state.industry.some(ind => ind === 'Retailing' ? p.sellable : p.industry === ind));
  // Apply the Show Restricted filter to the focus set BEFORE walking
  // upstream, not just to the final result -- otherwise a category/
  // classification/industry filter that's entirely restricted (e.g.
  // "Cigarettes" under The Emerging Dragon, itself hidden) still drags in
  // its raw-material ancestors (Timber, Paper) even though the one product
  // they exist to supply is invisible, producing a graph of orphaned nodes
  // with no visible endpoint. Filtering focus first means a fully-restricted
  // filter correctly shows nothing (with the usual "no products match"
  // message) instead of a useless stub.
  if (state.scenario && !state.showRestricted) focus = focus.filter(p => !scenarioRestricted(p));
  let result;
  if (!state.category && !state.classification && !state.industry) {
    result = focus;
  } else {
    const links = buildLinks(base);
    const incoming = new Map();
    links.forEach(l => {
      if (!incoming.has(l.target)) incoming.set(l.target, []);
      incoming.get(l.target).push(l.source);
    });
    const included = new Set(focus.map(p => p.name));
    function walkUp(name) {
      (incoming.get(name) || []).forEach(pr => { if (!included.has(pr)) { included.add(pr); walkUp(pr); } });
    }
    focus.forEach(p => walkUp(p.name));
    result = base.filter(p => included.has(p.name));
    // Ancestors pulled in by walkUp can themselves be restricted (and
    // weren't part of `focus`, so the filter above never saw them) -- filter
    // the final result too so none of them slip through when Show Restricted
    // is unchecked.
    if (state.scenario && !state.showRestricted) result = result.filter(p => !scenarioRestricted(p));
  }
  return result;
}

function renderGraph() {
  const el = document.getElementById('graph-view');
  const scopeLabel = state.gameset + (state.category ? ' — ' + state.category.join(' / ') + ' (+ upstream dependencies)' : '') + (state.classification ? ' — ' + state.classification + ' (+ upstream dependencies)' : '') + (state.industry ? ' — ' + state.industry.join(' / ') + ' (+ upstream dependencies)' : '') + (state.scenario && state.showRestricted ? ` — dimmed / struck-through nodes are restricted in this scenario` : '') + (state.scenario && !state.showRestricted ? ` — restricted nodes are hidden (see "Show Restricted" in the sidebar)` : '');
  el.innerHTML = `<div class="graph-toolbar"><span style="color:var(--muted)">Showing ${scopeLabel}</span>
    </div>
    <div class="tier-legend">Raw materials / livestock on the left &rarr; finished, never-reprocessed products on the right</div>
    <div class="graph-scroll"><svg id="full-graph-svg"></svg></div>`;

  const nodesList = graphScopeProducts();
  if (nodesList.length === 0) {
    const restrictionHint = (state.scenario && !state.showRestricted) ? ' Check "Show Restricted" in the sidebar if this filter is entirely restricted in this scenario.' : '';
    document.querySelector('.graph-scroll').innerHTML = `<div class="empty">No products match the current filters.${restrictionHint}</div>`;
    return;
  }
  drawLayeredGraph(d3.select('#full-graph-svg'), nodesList, {
    colWidth: 220, rowHeight: 32, minWidth: 900, minHeight: 500,
    showYield: false,
    showEdgeLabels: false,
    onClick: node => openDetailFromGraph(node.id),
  });
}

function openDetailFromGraph(id) {
  setView('grid');
  document.getElementById('viewGrid').classList.remove('active');
  openDetail(id);
}

// ---- Farmer's Almanac: every crop in the current gameset laid out together, ----
// ---- so growing seasons, climate/rainfall needs, and sellability can be compared at a glance. ----

const MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_SHORT = ['J','F','M','A','M','J','J','A','S','O','N','D'];
// Cold -> Cool -> Warm -> Hot is a single ordered temperature spectrum, not
// three named settings plus an unrelated fourth "Warm, Cool, or Cold"
// catch-all off to the side. A crop's growing_conditions.climate is either
// one specific band ('Cool', 'Warm', or 'Hot' -- 'Cold' alone never occurs
// standalone in the data) or the compound string 'Warm, Cool, or Cold',
// which just means "tolerates the three coldest bands, everything except
// Hot." climateBands() below decomposes that string back into the actual
// set of bands it names, so both cases render on the same spectrum instead
// of the compound case getting its own separate grey dot.
const CLIMATE_BANDS = ['Cold', 'Cool', 'Warm', 'Hot'];
const CLIMATE_COLOR = {
  'Cold': '#2E6FD9', 'Cool': '#4C9AFF', 'Warm': '#FFAB00', 'Hot': '#FF5630',
};
function climateBands(climate) {
  return climate === 'Warm, Cool, or Cold' ? ['Cold', 'Cool', 'Warm'] : [climate];
}
function climateBar(climate) {
  const active = new Set(climateBands(climate));
  let html = `<span class="climate-bar" title="${climate}">`;
  CLIMATE_BANDS.forEach(band => {
    html += `<span class="climate-seg${active.has(band) ? ' filled' : ''}" style="${active.has(band) ? `background:${CLIMATE_COLOR[band]}` : ''}"></span>`;
  });
  html += '</span>';
  return html;
}
const RAINFALL_LEVEL = { 'Little': 1, 'Moderate': 2, 'Plentiful': 3 };

function rainBar(rainfall) {
  const level = RAINFALL_LEVEL[rainfall] || 0;
  let html = '<span class="rain-bar">';
  for (let i = 1; i <= 3; i++) html += `<span class="${i <= level ? 'filled' : ''}"></span>`;
  html += '</span>';
  return html;
}

// Growing season can wrap around the calendar year (e.g. sow in May, harvest the
// following February) -- walk forward from the sowing month to the harvesting
// month, inclusive, wrapping past December back to January as needed.
function growingMonths(sowMonth, harvestMonth) {
  const sowIdx = MONTHS_FULL.indexOf(sowMonth);
  const harvestIdx = MONTHS_FULL.indexOf(harvestMonth);
  if (sowIdx === -1 || harvestIdx === -1) return new Set();
  const months = new Set();
  let i = sowIdx;
  while (true) {
    months.add(i);
    if (i === harvestIdx) break;
    i = (i + 1) % 12;
  }
  return months;
}

function almanacCrops() {
  let list = byGameset(state.gameset)
    .filter(p => p.classification === 'Plant Product' && p.growing_conditions);
  // scenarioRestricted(crop) is already a fully transitive check (see
  // scenarioHasMarket) -- for a raw Plant Product it means "not sellable
  // directly, AND every possible thing you could ever process it into,
  // however many stages downstream, is also unsellable." The game will
  // happily let you sow and harvest a crop like this (a Crop Growing Unit
  // doesn't know or care whether the Sales Unit downstream will connect), but
  // there is no legitimate reason to: unlike a farm byproduct such as Tallow
  // (itself unsellable, but the Soap made from it isn't -- that's a
  // Livestock Semi-Product, not a crop, so it never appears in this list),
  // a crop flagged here truly dead-ends. So it's hidden by default (like
  // every other view -- see state.showRestricted), and struck through when
  // "Show Restricted" reveals it.
  if (state.scenario && !state.showRestricted) list = list.filter(p => !scenarioRestricted(p));
  return list.sort((a, b) => MONTHS_FULL.indexOf(a.growing_conditions.sowing_month) - MONTHS_FULL.indexOf(b.growing_conditions.sowing_month) || a.name.localeCompare(b.name));
}

function renderAlmanac() {
  const el = document.getElementById('almanac-view');
  const crops = almanacCrops();
  if (crops.length === 0) {
    el.innerHTML = '<div class="empty">No crops with growing conditions in this gameset.</div>';
    return;
  }
  let html = `<div class="count">${crops.length} crop${crops.length === 1 ? '' : 's'} — ${state.gameset} gameset</div>`;
  html += `<div class="almanac-legend">
    <span class="item"><span class="climate-dot" style="background:${CLIMATE_COLOR['Cold']}"></span>Cold</span>
    <span class="item"><span class="climate-dot" style="background:${CLIMATE_COLOR['Cool']}"></span>Cool</span>
    <span class="item"><span class="climate-dot" style="background:${CLIMATE_COLOR['Warm']}"></span>Warm</span>
    <span class="item"><span class="climate-dot" style="background:${CLIMATE_COLOR['Hot']}"></span>Hot</span>
    <span class="item">${rainBar('Little')} Little rain</span>
    <span class="item">${rainBar('Moderate')} Moderate rain</span>
    <span class="item">${rainBar('Plentiful')} Plentiful rain</span>
    <span class="item"><span style="border-left:2px solid #57D9A3;padding-left:4px">Sow</span></span>
    <span class="item"><span style="border-right:2px solid #FFAB00;padding-right:4px">Harvest</span></span>
  </div>`;
  if (state.scenario) {
    html += `<div class="almanac-disclaimer">Crossed-out crops can still be sown and harvested -- the game won't stop you -- but the Sales Unit will never connect: neither the crop itself nor anything made from it, however many stages downstream, can be sold -- it's restricted in this scenario. Uncheck "Show Restricted" above if you'd rather filter them out of the list entirely.</div>`;
  }
  html += `<table class="almanac-table"><thead><tr>
    <th>Crop</th><th>Climate</th><th>Rainfall</th><th>Goods Type</th>
    ${MONTHS_SHORT.map(m => `<th class="month-cell">${m}</th>`).join('')}
  </tr></thead><tbody>`;
  crops.forEach(p => {
    const gc = p.growing_conditions;
    const months = growingMonths(gc.sowing_month, gc.harvesting_month);
    const sowIdx = MONTHS_FULL.indexOf(gc.sowing_month);
    const harvestIdx = MONTHS_FULL.indexOf(gc.harvesting_month);
    const restricted = scenarioRestricted(p);
    html += `<tr onclick="openDetail('${p.id.replace(/'/g,"\\'")}')" class="${restricted ? 'restricted-row' : ''}">
      <td><div class="almanac-crop"><img src="images/${p.icon_file}">${p.name}</div></td>
      <td>${climateBar(gc.climate)}${gc.climate}</td>
      <td>${rainBar(gc.rainfall)}${gc.rainfall}</td>
      <td>${goodsTypeLabel(p)}${restrictionNote(p)}</td>`;
    for (let m = 0; m < 12; m++) {
      const classes = ['month-cell'];
      if (months.has(m)) classes.push('grow');
      if (m === sowIdx) classes.push('sow');
      if (m === harvestIdx) classes.push('harvest');
      html += `<td class="${classes.join(' ')}"></td>`;
    }
    html += '</tr>';
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

function renderAll() {
  renderTabs();
  renderScenarioSelect();
  renderCategoryChips();
  renderClassChips();
  renderIndustryChips();
  renderSellableChips();
  if (state.view === 'grid') renderGrid();
  else if (state.view === 'graph') renderGraph();
  else if (state.view === 'almanac') renderAlmanac();
  // Any global filter change (scenario switch, category/classification chip,
  // etc.) needs to re-run the detail page too, or its restriction badges and
  // "Immediate Dependencies" list go stale -- e.g. switching from one scenario
  // to another while a product's detail page is open used to leave the old
  // scenario's badges on screen since this branch didn't exist.
  else if (state.view === 'detail' && state.detailId) openDetail(state.detailId);
}

renderAll();
</script>
