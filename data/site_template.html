<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Capitalism Plus — Product Reference</title>
<script src="d3.min.js"></script>
<style>
  :root {
    --retail: #0533FF;
    --semi: #FF2600;
    --livestock: #FF9300;
    --raw: #FF30E5;
    --plant: #941100;
    --bg: #14161a;
    --panel: #1e2127;
    --panel2: #262a32;
    --border: #383d47;
    --text: #e8e9ec;
    --muted: #9aa0ab;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Verdana, sans-serif;
    background: var(--bg); color: var(--text);
  }
  a { color: inherit; }
  header {
    padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap; position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 18px; margin: 0; white-space: nowrap; }
  header h1 span { color: var(--muted); font-weight: normal; font-size: 13px; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
    border: 1px solid var(--border); background: var(--panel2); color: var(--text);
  }
  .tab.active { background: var(--retail); border-color: var(--retail); color: white; }
  select, input[type=search] {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font-size: 13px;
  }
  .layout { display: flex; }
  aside {
    width: 220px; padding: 16px; border-right: 1px solid var(--border); min-height: calc(100vh - 60px);
    flex-shrink: 0;
  }
  aside h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 16px 0 8px; }
  aside h3:first-child { margin-top: 0; }
  .chip {
    display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 5px; cursor: pointer;
    font-size: 13px; margin-bottom: 2px;
  }
  .chip:hover { background: var(--panel2); }
  .chip.active { background: var(--panel2); font-weight: 600; }
  .chip.chip-restricted { opacity: 0.4; }
  .chip.chip-restricted .label { text-decoration: line-through; }
  .chip.chip-partial { opacity: 0.75; border: 1px dashed var(--muted); }
  .swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  main { flex: 1; padding: 20px; min-width: 0; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px;
    cursor: pointer; text-align: center; transition: border-color .1s;
  }
  .card:hover { border-color: var(--retail); }
  .card img { width: 64px; height: 64px; object-fit: contain; margin-bottom: 6px; background: #fff; border-radius: 6px; padding: 4px; }
  .card .name { font-size: 13px; font-weight: 600; }
  .card .cat { font-size: 11px; color: var(--muted); }
  /* Base pill shape/color -- NOT scoped to `.card`, because `.badge` is also
     used outside cards (e.g. the List view's Classification/Goods Type
     columns, restrictionBadge()'s pills in the Almanac and List). Scoping it
     to `.card .badge` meant every one of those other spots silently lost
     its rounded pill shape/padding/color and rendered as plain inline text
     with only its background color intact -- the same badge markup should
     look identical everywhere it appears. */
  .badge { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 10px; color: white; }
  .card .badge { margin-top: 6px; }
  .card.restricted { opacity: 0.4; }
  .card.restricted .name { text-decoration: line-through; }
  .count { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .layout-toggle { display: inline-flex; gap: 6px; margin-left: 14px; vertical-align: middle; }
  .layout-toggle .chip { padding: 3px 10px; font-size: 12px; }
  .grid-table { border-collapse: collapse; width: 100%; font-size: 12px; }
  .grid-table th, .grid-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  .grid-table th { color: var(--muted); font-weight: normal; text-transform: uppercase; font-size: 10px; letter-spacing: .04em; }
  .grid-table tbody tr { cursor: pointer; }
  .grid-table tbody tr:hover { background: var(--panel2); }
  .grid-table tr.restricted-row { opacity: 0.45; }
  .grid-table tr.restricted-row .grid-name-cell { text-decoration: line-through; }
  .grid-name-cell { display: flex; align-items: center; gap: 8px; }
  .grid-name-cell img { width: 30px; height: 30px; background: #fff; border-radius: 5px; padding: 2px; flex-shrink: 0; }

  .detail { max-width: 900px; }
  .back { display: inline-block; margin-bottom: 14px; cursor: pointer; color: var(--muted); font-size: 13px; }
  .back:hover { color: var(--text); }
  .detail-head { display: flex; gap: 20px; align-items: center; margin-bottom: 20px; }
  .detail-head img { width: 110px; height: 110px; background: #fff; border-radius: 10px; padding: 6px; }
  .detail-head h2 { margin: 0 0 4px; font-size: 24px; }
  .detail-head .cat { color: var(--muted); font-size: 14px; }
  .badge-lg { display: inline-block; margin-top: 8px; font-size: 12px; padding: 4px 10px; border-radius: 12px; color: white; }

  .bar-wrap { margin: 18px 0; }
  .bar { display: flex; height: 34px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
  .bar-seg { display: flex; align-items: center; justify-content: center; font-size: 11px; color: white; white-space: nowrap; overflow: hidden; }
  .bar-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .bar-legend .sw { width: 10px; height: 10px; display: inline-block; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

  .section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .section h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .kv { display: grid; grid-template-columns: 140px 1fr; row-gap: 6px; font-size: 13px; }
  .kv .k { color: var(--muted); }

  .yield-list, .rel-list { list-style: none; margin: 0; padding: 0; }
  .yield-list li, .rel-list li {
    display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-radius: 6px; cursor: pointer;
  }
  .yield-list li:hover, .rel-list li:hover { background: var(--panel2); }
  .yield-list img, .rel-list img { width: 32px; height: 32px; background: #fff; border-radius: 5px; padding: 2px; }
  .rel-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .rel-cols h4 { font-size: 12px; color: var(--muted); margin: 0 0 8px; font-weight: normal; }

  .graph-scroll { overflow: auto; background: var(--panel); border-radius: 8px; border: 1px solid var(--border); max-height: calc(100vh - 170px); }
  .node text { fill: var(--text); font-size: 11px; pointer-events: none; }
  .node text.node-yield { fill: var(--muted); font-size: 9px; }
  .node circle { stroke: #0006; stroke-width: 1px; cursor: pointer; }
  .link { stroke: #ffffff40; stroke-width: 1.3px; fill: none; }
  .graph-toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; font-size: 13px; flex-wrap: wrap; }
  .tier-legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); margin-bottom: 10px; }
  .tier-legend .sw { width: 10px; height: 10px; display: inline-block; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .spider-wrap { overflow-x: auto; background: var(--panel2); border-radius: 6px; }
  .edge-label rect { fill: var(--bg); fill-opacity: 0.9; stroke: var(--border); stroke-width: 0.6px; }
  .edge-label text { fill: var(--muted); font-size: 9.5px; pointer-events: none; }

  .almanac-table { border-collapse: collapse; width: 100%; font-size: 12px; }
  .almanac-table th, .almanac-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  .almanac-table th { color: var(--muted); font-weight: normal; text-transform: uppercase; font-size: 10px; letter-spacing: .04em; }
  .almanac-table tbody tr { cursor: pointer; }
  .almanac-table tbody tr:hover { background: var(--panel2); }
  .almanac-crop { display: flex; align-items: center; gap: 8px; }
  .almanac-crop img { width: 30px; height: 30px; background: #fff; border-radius: 5px; padding: 2px; flex-shrink: 0; }
  .rain-bar { display: inline-flex; gap: 2px; vertical-align: middle; margin-right: 6px; }
  .rain-bar span { width: 6px; height: 10px; border-radius: 1px; background: var(--border); }
  .rain-bar span.filled { background: #4C9AFF; }
  .climate-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: -1px; }
  .climate-bar { display: inline-flex; gap: 2px; vertical-align: middle; margin-right: 6px; }
  .climate-bar .climate-seg { width: 8px; height: 10px; border-radius: 1px; background: var(--border); }
  .month-cell { width: 20px; text-align: center; padding: 6px 2px; }
  .month-cell.grow { background: #2E9E4D55; }
  .month-cell.sow { border-left: 2px solid #57D9A3; }
  .month-cell.harvest { border-right: 2px solid #FFAB00; }
  .almanac-legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-bottom: 14px; }

  #scenarioSelect { width: 100%; margin-bottom: 8px; }
  .scenario-info { font-size: 12px; color: var(--muted); line-height: 1.45; margin-bottom: 16px; padding: 8px; background: var(--panel2); border-radius: 6px; }
  .scenario-info .goal { color: var(--text); }
  .scenario-info .clear { color: #4C9AFF; cursor: pointer; margin-top: 6px; display: inline-block; }
  .almanac-legend .item { display: flex; align-items: center; gap: 6px; }
  .almanac-disclaimer { font-size: 12px; color: var(--muted); line-height: 1.45; margin-bottom: 14px; padding: 8px 10px; background: var(--panel2); border-radius: 6px; border-left: 3px solid #FFAB00; }
  .almanac-table tr.restricted-row { opacity: 0.45; }
  .almanac-table tr.restricted-row .almanac-crop { text-decoration: line-through; }
  .restriction-note { font-size: 11px; font-weight: 600; white-space: nowrap; }
  .restriction-explain { font-size: 13px; line-height: 1.5; margin: 10px 0 16px; padding: 10px 12px; background: var(--panel2); border-radius: 6px; }
</style>
</head>
<body>

<header>
  <h1>Capitalism Plus <span>Product Reference</span></h1>
  <div class="tabs" id="gamesetTabs"></div>
  <input type="search" id="searchBox" placeholder="Search products…">
  <div class="tabs">
    <div class="tab" id="viewGrid" onclick="setView('grid')">Grid</div>
    <div class="tab" id="viewGraph" onclick="setView('graph')">Dependency Graph</div>
    <div class="tab" id="viewAlmanac" onclick="setView('almanac')">Farmer's Almanac</div>
  </div>
</header>

<div class="layout">
  <aside>
    <h3>Scenario Preset</h3>
    <select id="scenarioSelect"></select>
    <div id="scenarioInfo"></div>
    <h3>Category</h3>
    <div id="categoryChips"></div>
    <h3>Classification</h3>
    <div id="classChips"></div>
    <h3>Industry</h3>
    <div id="industryChips"></div>
    <h3>Goods Type</h3>
    <div id="sellableChips"></div>
  </aside>
  <main>
    <div id="grid-view"></div>
    <div id="detail-view" style="display:none"></div>
    <div id="graph-view" style="display:none"></div>
    <div id="almanac-view" style="display:none"></div>
  </main>
</div>

<script>
const PRODUCTS = __PRODUCTS_JSON__;
// Scenario restrictions are REAL and byte-verified, not inferred from prose.
// Every scenario's .SCN save file contains a 1-byte-per-ITEMCLAS flag array
// (offset 315, one byte per row of the gameset's own ITEMCLAS table, in table
// order; 1 = allowed, 0 = excluded). Decoded and cross-checked against all 20
// scenarios' .SCT text with zero mismatches, and confirmed live in-game:
// building a Cattle farm in Rule Britannia (which excludes LPRODUCT and FOOD,
// not LSEMI) produced Frozen Beef (LPRODUCT, directly blocked -- Sales unit
// never connects) and Milk (LSEMI, not itself blocked, but its only buyers --
// Cheese/Yogurt -- are category Food, which IS blocked, so it has no legal
// market anywhere), while Tallow (also LSEMI) sold fine because its buyer,
// Soap, is category Chemical Products -- not excluded. So a product can be
// unsellable in a scenario two ways: directly excluded by its own raw_class,
// or indirectly stranded because every possible buyer is excluded. Both are
// computed below (scenarioExcluded / scenarioHasMarket) against the real
// `excludedClasses` list -- nothing here is guessed.
// `years` / `bonus` are likewise decoded straight from the save header
// (offsets 179 / 183) and match the .SCT prose exactly.
//
// `dominateClasses` is a SECOND flag array in the same .SCN file, at offset
// 415 (exactly 100 bytes past excludedClasses, same 1-byte-per-ITEMCLAS-row
// layout, 1 = must dominate this market to win) -- the game's actual
// domination goal target, not the earlier discredited prose-guessing
// attempt (goal_focus_categories in scenarios.json, never used by the
// site). Verified against every scenario whose .SCT goal names specific
// categories, with zero mismatches: TECHNO's array is exactly {Automobile,
// Chemical Products, Computers, Electronic Products, Toys, Watches} (its
// prose lists exactly those 6); FORTIFY = {Beverage} ("leading the beverage
// market"); UNDER = {Food, Canned Food, Snacks}; VOGUE = {Apparel,
// Cosmetics, Jewelry, Optical Products}; GLOBAL = every sellable Standard
// category (matches "market dominance in every market"); DRAGON =
// {Chemical Products, Electronic Products}. Every scenario whose goal is
// phrased at the INDUSTRY level instead ("dominate manufacturing and
// retail", "mining and manufacturing sectors") decodes to an EMPTY array
// here -- consistent, not a gap -- because industry-level domination isn't
// a per-category concept at all; it lives in a THIRD flag array instead,
// `dominateIndustries`, at offset 305-308 (4 bytes, one per industry, 1 =
// must dominate). This was found and verified by comparing two DOSBox
// saves the user provided directly: SCENARIO_SPAIN and a custom "UTGAME1"
// game the user built with the same Manufacturing+Farming goal enabled by
// hand. Both saves showed identical bytes at 305-308 ([0,1,1,0]) while a
// third save with no industry goal (TECHNO) and an earlier state of the
// custom game (before its goal was set) both showed [0,0,0,0] -- a clean,
// independently-reproduced signal, not a guess. The byte ORDER inside the
// array is reversed from the display convention used elsewhere on this
// site: byte 305 = Retailing, 306 = Manufacturing, 307 = Farming, 308 =
// Raw Material Production. That mapping was solved (not assumed) by cross-
// checking all 7 industry-goal scenarios' prose simultaneously: BERLIN's
// single flagged byte (index 1) isolates Manufacturing on its own ("dominate
// the manufacturing sector"), which then anchors every other scenario's
// flagged pair/triple against its goal text with zero contradictions --
// ASIAN & ITALY = {Manufacturing, Retailing} ("manufacturing and retail
// sectors"), SPAIN = {Manufacturing, Farming} ("manufacturing...retaining
// leadership in farming"), UK = {Manufacturing, Raw Material Production}
// ("mining and manufacturing sectors" -- mining is Raw Material Production),
// VERTICAL = {Farming, Manufacturing, Retailing} ("farming, manufacturing,
// and retail industries"), GLOBAL = all four ("dominance in every single
// market"). GLOBAL is the one case where BOTH arrays are populated (15
// per-class codes AND all 4 industries) since "everything" is expressible
// either way; the UI prefers the industry list there to avoid a redundant
// 19-item display. The remaining scenarios (BRINK, DILEMMA, ENTREPRE, JAPAN,
// LATECOME, RACETIME, ROUGH) have no domination goal in their prose at all,
// and all three arrays are correctly empty for them. This entire mapping was
// re-verified a second time directly against fresh byte reads of all 20
// .SCN files (not just the original 7 discovery scenarios), with zero
// discrepancies -- see the SCENARIOS array below.
const SCENARIOS = [
  { key: "DRAGON", name: "The Emerging Dragon", gameset: "Standard",
    goal: "Dominate the chemical and electronic products market; $300M annual profit; 10,000 jobs; within 30 years.",
    years: 30, bonus: 60,
    excludedClasses: ["CIGAR", "FOOD", "FURN", "LPRODUCT", "PSEMI"],
    dominateClasses: ["CHEMGOOD", "ELEAPP"], dominateIndustries: [] },
  { key: "ASIAN", name: "The Asian Gold Rush", gameset: "Standard",
    goal: "Dominate manufacturing and retail sectors while producing 20+ product types within 30 years.",
    years: 30, bonus: 70,
    excludedClasses: ["FOOD", "LPRODUCT", "PSEMI"],
    dominateClasses: [], dominateIndustries: ["Manufacturing", "Retailing"] }, // byte-verified, see offset 305-308
  { key: "BERLIN", name: "Fall of the Berlin Wall", gameset: "Alternative",
    goal: "Dominate manufacturing; 15,000 jobs; $400M annual profit; within 20 years.",
    years: 20, bonus: 80,
    excludedClasses: [],
    dominateClasses: [], dominateIndustries: ["Manufacturing"] }, // byte-verified, see offset 305-308
  { key: "BRINK", name: "Back from the Brink", gameset: "Alternative",
    goal: "40% return-on-equity, $500M annual profit within 25 years.",
    years: 25, bonus: 120,
    excludedClasses: [],
    dominateClasses: [], dominateIndustries: [] },
  { key: "DILEMMA", name: "Diversification Dilemma", gameset: "Standard",
    goal: "Diversify into 50+ product types, $2B annual revenue, 30% operating margin within 30 years.",
    years: 30, bonus: 100,
    excludedClasses: [],
    dominateClasses: [], dominateIndustries: [] },
  { key: "ENTREPRE", name: "Entrepreneurial Spirit", gameset: "Standard",
    goal: "$100M annual revenue within 10 years (weak competitors).",
    years: 10, bonus: 30,
    excludedClasses: [],
    dominateClasses: [], dominateIndustries: [] },
  { key: "FORTIFY", name: "Market Fortification", gameset: "Food & Beverage",
    goal: "Control 3+ other companies within 30 years while leading the beverage market, $500M combined profit.",
    years: 30, bonus: 70,
    excludedClasses: [],
    dominateClasses: ["BEVERAGE"], dominateIndustries: [] },
  { key: "GLOBAL", name: "Global Domination", gameset: "Standard",
    goal: "Achieve market dominance in every market and 100% ownership within 40 years.",
    years: 40, bonus: 200,
    excludedClasses: [],
    // Byte-verified at BOTH offsets: the per-class array (15 sellable Standard classes) AND
    // the industry array (all 4 flagged) independently confirm the same "everything" goal.
    dominateClasses: ["AUTO", "BEVERAGE", "CHEMGOOD", "CIGAR", "COMPUTER", "COSMETIC", "ELEAPP", "FOOD", "FURN", "JEWELRY", "LPRODUCT", "PSEMI", "TOY", "WATCH", "WEAR"],
    dominateIndustries: ["Raw Material Production", "Farming", "Manufacturing", "Retailing"] },
  { key: "ITALY", name: "Italy — Looking South", gameset: "Standard",
    goal: "Dominate manufacturing and retail; $500M annual profit within 25 years.",
    years: 25, bonus: 70,
    excludedClasses: ["AUTO", "CIGAR", "JEWELRY"],
    dominateClasses: [], dominateIndustries: ["Manufacturing", "Retailing"] }, // byte-verified, see offset 305-308
  { key: "JAPAN", name: "Japan — Rising from the Ashes", gameset: "Alternative",
    goal: "$500M annual profit, 40% operating margin within 30 years.",
    years: 30, bonus: 100,
    excludedClasses: [],
    dominateClasses: [], dominateIndustries: [] },
  { key: "LATECOME", name: "Latecomer's Ambition", gameset: "Alternative",
    goal: "$10B annual revenue, control 4+ other companies within 40 years.",
    years: 40, bonus: 140,
    excludedClasses: [],
    dominateClasses: [], dominateIndustries: [] },
  { key: "RACETIME", name: "Race Against Time", gameset: "Alternative",
    goal: "$500M annual revenue, $100M annual profit within 6 years.",
    years: 6, bonus: 100,
    excludedClasses: ["HHOLD", "HPRODUCT", "JEWELRY", "TOY"],
    dominateClasses: [], dominateIndustries: [] },
  { key: "ROUGH", name: "The Rough Road Ahead", gameset: "Food & Beverage",
    goal: "$50M annual profit, 25+ different products within 15 years (only two cities, far apart).",
    years: 15, bonus: 70,
    excludedClasses: [],
    dominateClasses: [], dominateIndustries: [] },
  { key: "SILICON", name: "Silicon Dream", gameset: "Standard",
    goal: "Major computer-industry player, $5B market value within 35 years, retain 50%+ ownership.",
    years: 35, bonus: 140,
    excludedClasses: ["BEVERAGE", "CIGAR", "FOOD", "LPRODUCT", "PSEMI", "WEAR"],
    dominateClasses: ["COMPUTER", "ELEAPP"], dominateIndustries: [] },
  { key: "SPAIN", name: "The Reign in Spain", gameset: "Alternative",
    goal: "$400M annual profit; dominate manufacturing while retaining farming leadership; within 30 years.",
    years: 30, bonus: 70,
    excludedClasses: ["HHOLD", "HPRODUCT", "OFFEQUIP", "PHARMACE"],
    dominateClasses: [], dominateIndustries: ["Manufacturing", "Farming"] }, // byte-verified, see offset 305-308 (cross-checked live against a real DOSBox save)
  { key: "TECHNO", name: "Techno-Sweep", gameset: "Standard",
    goal: "Dominate listed markets with $500M annual profit within 35 years (no pre-existing high-tech products; R&D required).",
    years: 35, bonus: 70,
    excludedClasses: ["BEVERAGE", "CIGAR", "COSMETIC", "FOOD", "FURN", "JEWELRY", "LPRODUCT", "PSEMI", "WEAR"],
    dominateClasses: ["AUTO", "CHEMGOOD", "COMPUTER", "ELEAPP", "TOY", "WATCH"], dominateIndustries: [] },
  { key: "UK", name: "Rule Britannia", gameset: "Alternative",
    goal: "Dominate mining and manufacturing sectors, $500M annual operating profit within 30 years.",
    years: 30, bonus: 90,
    excludedClasses: ["APPAREL", "FOOD", "LPRODUCT"],
    dominateClasses: [], dominateIndustries: ["Raw Material Production", "Manufacturing"] }, // byte-verified, see offset 305-308
  { key: "UNDER", name: "Domination Down Under", gameset: "Food & Beverage",
    goal: "Dominate food, canned food, and snack markets; $400M annual profit; $200M personal wealth within 20 years.",
    years: 20, bonus: 90,
    excludedClasses: [],
    dominateClasses: ["CANFOOD", "FOOD", "SNACK"], dominateIndustries: [] },
  { key: "VERTICAL", name: "Vertical Integration", gameset: "Food & Beverage",
    goal: "Dominate farming, manufacturing, and retail; $800M annual revenue within 30 years.",
    years: 30, bonus: 80,
    excludedClasses: ["BEVERAGE", "PASTA", "SPICE"],
    dominateClasses: [], dominateIndustries: ["Farming", "Manufacturing", "Retailing"] }, // byte-verified, see offset 305-308
  { key: "VOGUE", name: "Staying in Vogue", gameset: "Alternative",
    goal: "Replace competitors as market leader in all relevant markets within 30 years.",
    years: 30, bonus: 90,
    excludedClasses: ["BEVERAGE", "CHEMGOOD", "FOOD", "HHOLD", "HPRODUCT", "LPRODUCT", "MEDIA", "OFFEQUIP", "PHARMACE", "PSEMI", "SPORTS", "TOY"],
    dominateClasses: ["APPAREL", "COSMETIC", "JEWELRY", "OPTICAL"], dominateIndustries: [] },
];

// Human-readable names for the raw ITEMCLAS codes used in excludedClasses,
// pulled from the game's own ITEMCLAS.NAME field across all 3 gamesets.
const CLASS_DISPLAY_NAME = {
  AUTO: "Automobile", BEVERAGE: "Beverage", CHEMGOOD: "Chemical Products", CIGAR: "Cigarettes",
  COMPUTER: "Computers", COSMETIC: "Cosmetics", ELEAPP: "Electronic Products", FOOD: "Food",

// consumers is a Consumer Good even if it's ALSO used as an ingredient

const CROP_BLOCKED_COLOR = "#2E7D32";

//
